<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrimPot Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: rgba(20, 20, 40, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2a2a4a;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.1);
        }
        .login-card h1 {
            color: #00aaff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .login-card h1 i {
            margin-right: 10px;
        }
        .form-control {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: white;
            padding: 12px;
        }
        .form-control:focus {
            background: #1a1a2e;
            color: white;
            border-color: #00aaff;
            box-shadow: none;
        }
        .btn-primary {
            background: #00aaff;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background: #0088cc;
        }
        .error {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
        }
        .demo-hint {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1><i class="bi bi-shield-lock"></i> GrimPot</h1>
        <form id="loginForm">
            <div class="mb-3">
                <input type="password" class="form-control" id="apiKey" placeholder="Enter API Key" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="demo-hint">
            Demo credentials: Use any key (demo mode)
        </div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        // For demo purposes, any key works
        // In production, this would validate against your backend
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value;
            if (apiKey) {
                localStorage.setItem('grimpot_auth', 'true');
                localStorage.setItem('grimpot_key', apiKey);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').innerText = 'Please enter an API key';
            }
        });
    </script>
</body>
</html>
